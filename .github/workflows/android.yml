name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fipsa
        uses: actions/checkout@v4
        with:
          path: fipsa

      - name: Checkout upstream fips
        uses: actions/checkout@v4
        with:
          repository: k0sti/fips
          path: fips

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fipsa/rust/fips-android/target
          key: rust-test-${{ hashFiles('fipsa/rust/fips-android/Cargo.lock') }}

      - name: Run upstream fips tests (core only)
        run: cargo test --no-default-features --manifest-path fips/Cargo.toml

      - name: Run upstream fips tests (full)
        run: cargo test --manifest-path fips/Cargo.toml

      - name: Run fips-android tests
        run: cargo test --manifest-path fipsa/rust/fips-android/Cargo.toml

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - name: Checkout fipsa
        uses: actions/checkout@v4
        with:
          path: fipsa

      - name: Checkout upstream fips
        uses: actions/checkout@v4
        with:
          repository: k0sti/fips
          path: fips

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fipsa/rust/fips-android/target
          key: rust-android-${{ hashFiles('fipsa/rust/fips-android/Cargo.lock') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Build Rust libraries for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        working-directory: fipsa/rust/fips-android
        run: |
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../app/src/main/jniLibs/armeabi-v7a
          cargo ndk -t aarch64-linux-android -o ../../app/src/main/jniLibs build --release
          cargo ndk -t armv7-linux-androideabi -o ../../app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: fipsa
        run: ./gradlew assembleDebug

      - name: Run Kotlin unit tests
        working-directory: fipsa
        run: ./gradlew test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fipsa-debug
          path: fipsa/app/build/outputs/apk/debug/*.apk

  instrumented-tests:
    name: Emulator Tests
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - name: Checkout fipsa
        uses: actions/checkout@v4
        with:
          path: fipsa

      - name: Checkout upstream fips
        uses: actions/checkout@v4
        with:
          repository: k0sti/fips
          path: fips

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fipsa/rust/fips-android/target
          key: rust-emulator-${{ hashFiles('fipsa/rust/fips-android/Cargo.lock') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Build Rust library for x86_64 (emulator)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        working-directory: fipsa/rust/fips-android
        run: |
          mkdir -p ../../app/src/main/jniLibs/x86_64
          cargo ndk -t x86_64-linux-android -o ../../app/src/main/jniLibs build --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: fipsa
          script: ./gradlew connectedAndroidTest
