[package]
name = "fips-android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "fips_android"

[dependencies]
fips = { path = "../../../fips", default-features = false, features = ["core"] }
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
log = "0.4"
android_logger = "0.14"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
lto = true
opt-level = "s"
strip = true
